name: workstation-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[mt5,desktop]"
      - run: python -m unittest discover -s tests -v
      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('Start-FXB.ps1', 'Update-FXB.ps1', 'Start-FXB-Training.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Error; exit 1 }
          }
      - run: python -m fxb synth --symbol US100 --bars 1000 --out data/smoke.csv
      - run: python -m fxb train --data data/smoke.csv --out runs/smoke --epochs 1
      - run: python -m fxb evaluate --data data/smoke.csv --model runs/smoke/model.npz
  full-connectome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      FXB_FULL_BRAIN_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[brain,desktop]"
      - run: python -m fxb brain-install
      - run: python -m unittest discover -s tests -p test_full_brain.py -v
